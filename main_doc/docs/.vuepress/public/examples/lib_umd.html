<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <!-- このサイトの dist/ を使う。外部では https://cdn.jsdelivr.net/npm/shogi-player@1.1.15/dist/lib/production/shogi-player.umd.min.js -->
    <script defer src="/dist/lib/production/shogi-player.umd.min.js"></script>
    <script type="module">
      new Vue({el: "#app", components: { ShogiPlayer }})
    </script>
  </head>
  <body>
    <div id="app">
      <shogi-player
        sp_mode="play"
        sp_body="position startpos moves 7g7f 3c3d"
        sp_controller
        ></shogi-player>
    </div>
  </body>
</html>
